name: Linux XFCE RDP (Tailscale Secure)

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Atualizar sistema
        run: |
          sudo apt update
          sudo apt upgrade -y

      - name: Instalar XFCE, XRDP e dependências
        run: |
          sudo apt install xfce4 xfce4-goodies xrdp dbus-x11 lightdm -y

          # Criar arquivo .xsession
          echo "export XDG_CONFIG_DIRS=/etc/xdg" > ~/.xsession
          echo "startxfce4" >> ~/.xsession
          chmod +x ~/.xsession

          # Corrigir startwm.sh do XRDP
          sudo sed -i '$i startxfce4' /etc/xrdp/startwm.sh
          sudo adduser xrdp ssl-cert

          # Garantir D-Bus ativo
          sudo service dbus start
          export $(dbus-launch)

          # Habilitar e reiniciar XRDP
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Criar usuário RDP
        run: |
          sudo useradd -m clouduser
          echo "clouduser:123456" | sudo chpasswd
          sudo usermod -aG sudo clouduser

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Conectar Tailscale
        run: |
          # Usa Auth Key segura do GitHub Secrets
          sudo tailscale up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=github-linux

      - name: Mostrar IP e credenciais RDP
        run: |
          echo "===================================="
          echo "RDP ready!"
          echo "User: clouduser"
          echo "Password: 123456"
          echo "Tailscale IP:"
          tailscale ip -4
          echo "===================================="

      - name: Manter VM ativa
        run: |
          while true; do sleep 300; done
